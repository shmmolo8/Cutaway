# Publishes the viewer to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# The models in build/ are committed, so this needs only Node (no Python / CAD).
name: Deploy viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      - run: npx vite build
        working-directory: viewer
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist
      - id: deployment
        uses: actions/deploy-pages@v4
